<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>FORMS</title>
  </head>
  <body>
    <form action="" class="user-data" autocomplete="on">
      <div class="block">
        <h2>Registration form</h2>
        <div class="line">
          <input type="text" placeholder="Username" />
        </div>
        <div class="line">
          <input type="email" placeholder="Email address" />
        </div>
        <div class="line">
          <input type="password" placeholder="Password" />
          <input type="password" placeholder="Confirm password" />
        </div>
      </div>
      <div class="block">
        <h2>Personal details</h2>
        <div class="line">
          <input type="text" placeholder="First name" />
          <input type="text" placeholder="First name" />
        </div>
        <div class="line">
          <select name="sex" id="sex">
            <option value="male">Male</option>
            <option value="female">Female</option>
          </select>
          <input type="date" name="" id="" />
        </div>
      </div>

      <div class="line2">
        <input type="checkbox" name="conv" id="conv1" />
        <label for="conv1">I want to receive news and special offers</label>
        <br />
        <input type="checkbox" name="conv" id="conv1" />
        <label for="conv1">I agree with the Terms and Conditions</label>
      </div>
      <div class="line3">
        <button type="submit">SUBMIT</button>
      </div>
    </form>
  </body>
</html>
